services:
  mysql:
    image: mysql:8.0
    container_name: ruzzco-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env (see .env.example)}
      MYSQL_DATABASE: ruzzco_db
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env (see .env.example)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env (see .env.example)}
    ports:
      # Localhost only: Next.js runs on this PC, phones only need port 3000.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    container_name: ruzzco-ml

    ports:
      # Localhost only: /forecast has no PIN; the owner sees it through Next.js.
      - "127.0.0.1:8001:8000"
    volumes:
      - ./ml-service:/app

volumes:
  mysql_data:
    driver: local
